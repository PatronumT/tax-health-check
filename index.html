<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#16140E">
<title>餐饮企业财税健康自测</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#16140E;
  --ink:#F0EBDD;
  --ink2:#B5AE9C;
  --ink3:#7E7867;
  --gold:#C9A227;
  --gold-hi:#E8C95C;
  --gold-line:rgba(201,162,39,.34);
  --jade:#8FB996;
  --terra:#C96A4A;
  --amber:#D3953B;
  --card:rgba(244,236,214,.035);
  --card2:rgba(244,236,214,.055);
  --line:rgba(240,235,221,.13);
  --line-soft:rgba(240,235,221,.08);
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono","Cascadia Code","SF Mono",Consolas,monospace;
}
html{background:#0E0D09}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
#flow{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 55%,rgba(10,9,5,.55) 100%)}
.page{position:relative;z-index:2;max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.V{display:none;flex-direction:column;flex:1}.V.on{display:flex}

/* ── 封面 ─────────────────────────── */
.v0{padding:0 30px;justify-content:center;position:relative;min-height:100vh}
.wm{position:absolute;right:-14px;bottom:6vh;font-family:var(--serif);font-weight:900;font-size:200px;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(201,162,39,.12);pointer-events:none;user-select:none}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:34px}
.brand-line{width:26px;height:1px;background:var(--gold)}
.brand-t{font-size:12px;letter-spacing:.32em;color:var(--gold);font-weight:600}
.brand-en{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--ink3)}
.s-ey{font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--ink3);margin-bottom:18px}
.s-title{font-family:var(--serif);font-weight:900;font-size:42px;line-height:1.28;margin-bottom:20px;color:var(--ink)}
.s-title .g{background:linear-gradient(180deg,#F5EEDC 10%,var(--gold-hi) 55%,var(--gold) 95%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(201,162,39,.25))}
.s-sub{font-size:15px;line-height:1.9;color:var(--ink2);margin-bottom:44px}
.s-sub em{font-style:normal;color:var(--gold-hi);font-weight:600}
.s-row{display:flex;border:1px solid var(--gold-line);background:var(--card);margin-bottom:38px;backdrop-filter:blur(6px)}
.s-cell{flex:1;padding:20px 8px;text-align:center;border-right:1px solid var(--line-soft)}.s-cell:last-child{border-right:none}
.s-cell-v{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--gold-hi);line-height:1;margin-bottom:7px}.s-cell-v span{font-size:11px;font-weight:400;color:var(--ink3)}
.s-cell-l{font-size:11px;color:var(--ink3);letter-spacing:.08em}
.btn-go{display:block;width:100%;padding:18px;background:linear-gradient(135deg,var(--gold) 0%,var(--gold-hi) 55%,var(--gold) 100%);color:#1A1608;border:none;font-size:16px;font-weight:700;letter-spacing:.2em;cursor:pointer;transition:transform .15s,box-shadow .3s;box-shadow:0 6px 30px rgba(201,162,39,.28)}
.btn-go:active{transform:scale(.98)}
.s-note{margin-top:20px;text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--ink3);opacity:.75;line-height:1.8}

/* ── 答题 ─────────────────────────── */
.v1{padding:26px 22px;min-height:100vh}
.q-brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.q-brand-t{font-size:10px;letter-spacing:.28em;color:var(--ink3)}
.q-brand-en{font-family:var(--mono);font-size:9px;letter-spacing:.15em;color:var(--ink3);opacity:.6}
.q-top{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.q-num{font-family:var(--serif);font-weight:900;font-size:40px;line-height:1;background:linear-gradient(180deg,#F5EEDC,var(--gold-hi) 70%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.q-of{font-family:var(--mono);font-size:12px;color:var(--ink3)}
.q-pbar{height:2px;background:var(--line-soft);overflow:hidden;margin-bottom:26px}
.q-pfill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-hi));box-shadow:0 0 8px rgba(201,162,39,.6);transition:width .5s cubic-bezier(.4,0,.2,1)}
.q-card{background:var(--card);border:1px solid var(--line);flex:1;display:flex;flex-direction:column;overflow-y:auto;backdrop-filter:blur(6px)}
.q-hd{padding:22px 22px 0}
.q-tag{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.18em;padding:5px 12px;margin-bottom:16px;border:1px solid}
.q-tag-h{color:var(--terra);border-color:rgba(201,106,74,.5);background:rgba(201,106,74,.07)}
.q-tag-m{color:var(--amber);border-color:rgba(211,149,59,.45);background:rgba(211,149,59,.06)}
.q-tag-l{color:var(--jade);border-color:rgba(143,185,150,.4);background:rgba(143,185,150,.05)}
.q-text{font-size:15.5px;line-height:1.95;color:var(--ink2);padding:0 22px;margin-bottom:22px}
.q-opts{border-top:1px solid var(--line)}
.q-opt{display:flex;align-items:flex-start;gap:14px;padding:17px 22px;border-bottom:1px solid var(--line-soft);cursor:pointer;transition:background .2s;-webkit-tap-highlight-color:transparent;position:relative}
.q-opt:last-child{border-bottom:none}
.q-opt:active{background:rgba(244,236,214,.05)}
.q-opt.on{background:rgba(201,162,39,.07)}
.q-opt.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(180deg,var(--gold),var(--gold-hi))}
.q-dot{width:17px;height:17px;border:1.5px solid var(--ink3);border-radius:50%;flex-shrink:0;margin-top:3px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.q-opt.on .q-dot{border-color:var(--gold-hi);background:rgba(201,162,39,.15);box-shadow:0 0 10px rgba(201,162,39,.35)}
.q-opt.on .q-dot::after{content:"";width:7px;height:7px;background:var(--gold-hi);border-radius:50%}
.q-opt-t{font-size:14.5px;line-height:1.7;color:var(--ink3);transition:color .2s}
.q-opt.on .q-opt-t{color:var(--ink);font-weight:500}
.q-nav{display:flex;gap:12px;margin-top:22px}
.btn-q{flex:1;padding:16px;font-size:14px;font-weight:600;letter-spacing:.15em;cursor:pointer;transition:transform .15s}
.btn-q:active{transform:scale(.98)}
.btn-bk{background:transparent;border:1px solid var(--line);color:var(--ink3)}
.btn-fw{background:linear-gradient(135deg,var(--gold),var(--gold-hi) 55%,var(--gold));border:none;color:#1A1608;box-shadow:0 4px 20px rgba(201,162,39,.22)}
.btn-fw:disabled{background:rgba(244,236,214,.08);color:var(--ink3);box-shadow:none;cursor:not-allowed}
.btn-fw:disabled:active{transform:none}

/* ── 结果 ─────────────────────────── */
.v2{padding:0 0 40px}
.r-hero{padding:46px 28px 30px;text-align:center;position:relative}
.r-ey{font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--ink3);margin-bottom:6px}
.r-brand{font-size:11px;letter-spacing:.3em;color:var(--gold);font-weight:600;margin-bottom:30px}
.r-ring{position:relative;width:230px;height:230px;margin:0 auto 26px}
.r-ring svg{transform:rotate(-90deg)}
.r-ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.r-sc-row{display:flex;align-items:baseline;gap:4px}
.r-sc{font-family:var(--serif);font-weight:900;font-size:72px;line-height:1;letter-spacing:-.03em;background:linear-gradient(180deg,#F5EEDC 5%,var(--gold-hi) 60%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(201,162,39,.3))}
.r-sc-u{font-size:15px;color:var(--ink3)}
.r-ring-l{font-family:var(--mono);font-size:9px;letter-spacing:.25em;color:var(--ink3);margin-top:8px}
.r-seal-w{display:flex;justify-content:center;margin-bottom:14px}
.seal{display:inline-block;font-family:var(--serif);font-weight:700;font-size:17px;letter-spacing:.28em;padding:9px 20px 9px 24px;border:1.5px solid;transform:rotate(-3.5deg);position:relative}
.seal::after{content:"";position:absolute;inset:3px;border:1px solid;opacity:.35}
.r-guide{font-size:11px;color:var(--ink3);letter-spacing:.05em}
.r-body{padding:8px 22px 0}
.panel{background:var(--card);border:1px solid var(--line);backdrop-filter:blur(6px);margin-bottom:14px}
.panel.goldline{border-color:var(--gold-line);background:var(--card2)}
.r-kpis{display:grid;grid-template-columns:repeat(3,1fr)}
.r-kpi{padding:18px 8px;text-align:center;border-right:1px solid var(--line-soft)}.r-kpi:last-child{border-right:none}
.r-kpi-l{font-size:10px;color:var(--ink3);letter-spacing:.12em;margin-bottom:9px}
.r-kpi-v{font-family:var(--mono);font-size:25px;font-weight:700;line-height:1;margin-bottom:6px}
.r-kpi-s{font-family:var(--mono);font-size:9px;color:var(--ink3);opacity:.7}
.r-spec{padding:18px 18px 15px}
.r-spec-h{font-family:var(--mono);font-size:10px;letter-spacing:.15em;color:var(--ink3);margin-bottom:15px}
.r-bar-w{position:relative;margin-bottom:9px}
.r-bar{height:5px;background:linear-gradient(90deg,rgba(201,106,74,.65) 0%,rgba(211,149,59,.55) 42%,rgba(201,162,39,.5) 62%,rgba(143,185,150,.55) 100%)}
.r-pin{position:absolute;top:-4px;width:13px;height:13px;border-radius:50%;background:var(--gold-hi);border:2px solid #16140E;box-shadow:0 0 12px rgba(232,201,92,.7);transform:translateX(-50%);transition:left 1.4s cubic-bezier(.34,1.56,.64,1)}
.r-lbs{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;color:var(--ink3)}
.r-msg{padding:22px 20px;font-size:14.5px;line-height:2;color:var(--ink2);position:relative}
.r-msg::before{content:"诊断意见";display:block;font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--gold);margin-bottom:10px}
.r-tbl{margin-bottom:18px}
.r-tbl-h{font-family:var(--mono);font-size:10px;letter-spacing:.15em;color:var(--ink3);padding:16px 20px 13px;border-bottom:1px solid var(--gold-line)}
.r-tr{display:flex;align-items:center;padding:0 20px;border-bottom:1px dashed var(--line-soft);min-height:48px}.r-tr:last-child{border-bottom:none}
.r-tr-n{flex:1;font-size:13px;color:var(--ink2);padding:11px 0}
.r-tr-b{width:62px;margin-right:12px}
.r-tr-bi{height:3px;background:rgba(240,235,221,.07);overflow:hidden}
.r-tr-bf{height:100%;transition:width 1s cubic-bezier(.4,0,.2,1)}
.r-tr-bf.bad{background:linear-gradient(90deg,rgba(201,106,74,.6),var(--terra))}
.r-tr-bf.half{background:linear-gradient(90deg,rgba(211,149,59,.5),var(--amber))}
.r-tr-bf.ok{background:var(--jade)}
.r-tr-v{min-width:42px;text-align:right;font-family:var(--mono);font-size:13px;font-weight:700}
.r-tr-v.bad{color:var(--terra)}.r-tr-v.half{color:var(--amber)}.r-tr-v.ok{color:var(--jade)}
.btn-redo{display:block;width:100%;padding:15px;background:transparent;border:1px solid var(--line);font-size:13px;letter-spacing:.15em;font-weight:500;color:var(--ink3);cursor:pointer;transition:transform .15s}
.btn-redo:active{transform:scale(.98)}
.r-foot{margin-top:30px;text-align:center}
.r-foot-line{width:30px;height:1px;background:var(--gold-line);margin:0 auto 14px}
.r-foot-b{font-size:12px;letter-spacing:.35em;color:var(--gold);font-weight:600;margin-bottom:6px}
.r-foot-en{font-family:var(--mono);font-size:8.5px;letter-spacing:.25em;color:var(--ink3);opacity:.6;margin-bottom:16px}
.r-fine{font-size:10px;color:var(--ink3);opacity:.65;line-height:1.8;padding:0 30px}

.an{animation:su .5s cubic-bezier(.4,0,.2,1) both}
.d1{animation-delay:.05s}.d2{animation-delay:.12s}.d3{animation-delay:.2s}.d4{animation-delay:.28s}.d5{animation-delay:.36s}
@keyframes su{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:400px){.s-title{font-size:35px}.r-sc{font-size:62px}.r-ring{width:206px;height:206px}.r-ring svg{width:206px;height:206px}.wm{font-size:160px}.r-tr-b{width:48px}}
</style>
</head>
<body>
<canvas id="flow"></canvas>
<div class="vignette"></div>
<div class="page">

  <div class="V v0 on" id="v0">
    <div class="wm">税</div>
    <div class="brand"><span class="brand-line"></span><span class="brand-t">函霖财税</span><span class="brand-en">HANLIN TAX</span></div>
    <div class="s-ey">RESTAURANT TAX HEALTH CHECK</div>
    <h1 class="s-title">餐饮企业<br><span class="g">财税健康自测</span></h1>
    <p class="s-sub">10 分钟自查，看看您的利润<br>有多少在<em>&ldquo;裸奔&rdquo;</em></p>
    <div class="s-row"><div class="s-cell"><div class="s-cell-v">11</div><div class="s-cell-l">道风险题</div></div><div class="s-cell"><div class="s-cell-v">5<span> 分钟</span></div><div class="s-cell-l">完成时间</div></div><div class="s-cell"><div class="s-cell-v">0</div><div class="s-cell-l">信息收集</div></div></div>
    <button class="btn-go" id="btnGo">开 始 自 测</button>
    <p class="s-note">完全匿名 &middot; 数据仅在您的设备上运行</p>
  </div>

  <div class="V v1" id="v1">
    <div class="q-brand"><span class="q-brand-t">函霖财税 &middot; 风险自测</span><span class="q-brand-en">HANLIN TAX</span></div>
    <div class="q-top"><span class="q-num" id="qN"></span><span class="q-of" id="qO"></span></div>
    <div class="q-pbar"><div class="q-pfill" id="qP"></div></div>
    <div class="q-card" id="qC"></div>
    <div class="q-nav"><button class="btn-q btn-bk" id="bB">上一题</button><button class="btn-q btn-fw" id="bF">下一题</button></div>
  </div>

  <div class="V v2" id="v2"><div id="rC"></div></div>
</div>

<script>
(function(){
/* ── 墨流背景 ── */
var cv=document.getElementById("flow"),cx=cv.getContext("2d"),BW,BH,DPR=Math.min(window.devicePixelRatio||1,2);
function rs(){BW=window.innerWidth;BH=window.innerHeight;cv.width=BW*DPR;cv.height=BH*DPR;cx.setTransform(DPR,0,0,DPR,0,0);}
rs();window.addEventListener("resize",rs);
var blobs=[
 {x:.22,y:.18,r:.55,c:"201,162,39",a:.055,sx:.00016,sy:.00011,p:0},
 {x:.82,y:.75,r:.6,c:"124,147,184",a:.045,sx:.00013,sy:.00017,p:2.1},
 {x:.55,y:.45,r:.45,c:"201,162,39",a:.035,sx:.0001,sy:.00014,p:4.2}
];
var fr=0;
function loop(t){
  fr++;
  if(fr%2===0){
    cx.clearRect(0,0,BW,BH);
    for(var i=0;i<blobs.length;i++){
      var b=blobs[i];
      var x=(b.x+Math.sin(t*b.sx+b.p)*.09)*BW;
      var y=(b.y+Math.cos(t*b.sy+b.p)*.09)*BH;
      var r=b.r*Math.max(BW,BH);
      var g=cx.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0,"rgba("+b.c+","+b.a+")");
      g.addColorStop(1,"rgba("+b.c+",0)");
      cx.fillStyle=g;cx.fillRect(0,0,BW,BH);
    }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ── 题库（内容与原版一致，未改动） ── */
var W=[12,12,12,12,12,7,7,7,7,5,5];
var Q=[];
Q.push([1,"多执照/多门店混同穿透",W[0],
"名下有好几个个体户或公司，收入、采购、员工工资全搅在一起，这家收的钱拿去补那家的亏，会计随便分着报。自己觉得反正都是“自己的生意”——可一旦哪家被查，所有关联主体的账都会被打通看，一家出事全部牵连。这个穿透风险，您清楚吗？",
["不清楚，我的几家店确实都混着管",1],["大概知道不对，但没办法分开",0.5],["每家都独立核算，互不穿帮 / 只有单店",0]]);
Q.push([2,"拆分收入套用小规模额度",W[1],
"为了省税，开好几个执照，每个季度开票都卡在30万以内，或者月度10万以内，维持小规模纳税人。税务局现在是按实际控制人合并计算的，穿透后超过了照样补税——这个判定方式，您了解过吗？",
["没了解，觉得一直这样没事",1],["知道有规定，但还在这么做",0.5],["没有拆分，就一个执照合规纳税",0]]);
Q.push([3,"私卡收款",W[2],
"生意忙，用个人微信、支付宝或家人的卡收营业款，确实方便。但现在银行会把大额私卡流水直接推给税务局——这个新规矩，您有没有留意过？",
["知道，但还这么做",1],["没想过，一直这么做",0.5],["已经全部走对公账户了",0]]);
Q.push([4,"加盟费私收",W[3],
"加盟商的钱不走对公账、不开发票，直接打到个人卡上。对方跟您好的时候没事，一旦闹翻去举报，您前几年的私账都会被翻出来查个遍——这个雷握在别人手里，您担心过吗？",
["担心，但一直都是这么收的",1],["没想过加盟商还会举报",0.5],["全部走公账规范开票 / 无加盟业务",0]]);
Q.push([5,"未开票收入隐匿",W[4],
"除了平台上必须开票的部分，剩下的散客、团餐款、宴席定金，不开票也不申报。税务局会拿您周围同行的平均数据和您比，长期偏低系统会自动报警——这个比对机制，您听说过吗？",
["没听说，未开票的部分我确实没报",1],["听说过，但还是没报",0.5],["没报的也正常申报了",0]]);
Q.push([6,"采购无票",W[5],
"图便宜采购食材不要票，大家都懂。可成本票缺口一大，要么硬抗多交税，要么用别的发票往里“凑”，或者虚列一部分。您现在是哪种情况？",
["缺口大，多交税又不甘心",1],["在用其他发票冲抵或虚列，先混过去",0.5],["基本都要票，缺口很小",0]]);
Q.push([7,"大额装修无票",W[6],
"几十万甚至上百万的装修，包工头开不了票，您就用一纸协议或白条入账，慢慢摊销。一旦查账，没票的成本全部被扒掉，让您补一大笔企业所得税——这个金额您大概算过会是多少吗？",
["没算过，不知道会补多少",1],["知道风险大，但没办法解决",0.5],["大额支出都要到了合规发票 / 无此类支出",0]]);
Q.push([8,"公私不分：报销和借款",W[7],
"自己的车、孩子的兴趣班、家里的开销往公司账上报，或者从公司账户直接打钱给个人用，账上长期挂着“老板借款”几十万上百万。会计上这叫股东消费或占款，被查到不仅要补企业所得税，还要追缴20%的分红个税——这个账，以前有人帮您算过吗？",
["没算过，一直这么操作",1],["知道有点问题，但拖着没处理",0.5],["个人和公司账目分得很清，没有大额挂账",0]]);
Q.push([9,"工资分拆",W[8],
"工资分两批发，公账发基本工资保个税最低档，剩下的用私卡或现金补。办法不新鲜，可一旦有员工闹翻了去举报，所有人的账都会翻一遍——这事您琢磨过吗？",
["知道有隐患，但没找到好办法",1],["没想过，觉得内部人不会捅",0.5],["工资全额走公账并报税",0]]);
Q.push([10,"社保缴纳不合规",W[9],
"员工社保这块，是不是有不少人没交、少交，或者不管工资多少统统按最低基数交？试用期不交更常见。社保现在归税务管，数据一比对就穿帮，一旦被查，要补缴从入职起所有年份的社保，外加滞纳金——您店里现在这个情况存在吗？",
["挺普遍的，不少人都没交或按最低交",1],["只有少数几个人没交或没交全",0.5],["全体员工都足额缴纳",0]]);
Q.push([11,"僵尸店不注销",W[10],
"干不下去的门店关了就不管了，营业执照不注销、税务不申报，以为没经营就是零。结果法人会被列入黑名单，连累您还在正常经营的其他店，甚至影响个人贷款、出行、孩子上学——您有没有这样的“僵尸店”一直搁着？",
["有，关了就没管过",1],["不确定现在状态算不算异常",0.5],["关一家清一家，都注销干净了",0]]);

var c=0,a=[];
for(var i=0;i<Q.length;i++) a.push(-1);
var v0=document.getElementById("v0"),v1=document.getElementById("v1"),v2=document.getElementById("v2");
var qN=document.getElementById("qN"),qO=document.getElementById("qO"),qP=document.getElementById("qP");
var qC=document.getElementById("qC"),bB=document.getElementById("bB"),bF=document.getElementById("bF");
var rC=document.getElementById("rC");

document.getElementById("btnGo").addEventListener("click",function(){v0.classList.remove("on");v1.classList.add("on");window.scrollTo(0,0);draw();});
bB.addEventListener("click",function(){if(c>0){c--;draw();}});
bF.addEventListener("click",function(){if(a[c]<0)return;if(c<Q.length-1){c++;draw();}else showResult();});
qC.addEventListener("click",function(e){var el=e.target;while(el&&el!==qC){if(el.getAttribute&&el.getAttribute("data-i")!==null){a[c]=parseInt(el.getAttribute("data-i"),10);draw();return;}el=el.parentElement;}});

function draw(){
  var q=Q[c],n=Q.length;
  qN.textContent=String(q[0]).padStart(2,"0");
  qO.textContent=" / "+n;
  qP.style.width=((c+1)/n*100)+"%";
  var tc=q[2]>=10?"q-tag-h":q[2]>=6?"q-tag-m":"q-tag-l";
  var tl=q[2]>=10?"高风险项":q[2]>=6?"中风险项":"一般项";
  var h='<div class="q-hd"><div class="q-tag '+tc+'">'+tl+'</div></div>';
  h+='<div class="q-text">'+q[3]+'</div><div class="q-opts">';
  for(var j=0;j<3;j++){
    var s=a[c]===j?" on":"";
    h+='<div class="q-opt'+s+'" data-i="'+j+'"><div class="q-dot"></div><div class="q-opt-t">'+q[4+j][0]+'</div></div>';
  }
  h+="</div>";
  qC.innerHTML=h;
  bB.style.visibility=c===0?"hidden":"visible";
  bF.textContent=c===n-1?"查看结果":"下一题";
  bF.disabled=a[c]<0;
  window.scrollTo(0,0);
}

function showResult(){
  var deduct=0,ri=0,si=0,rows=[];
  for(var k=0;k<Q.length;k++){
    var q=Q[k];
    var sv=q[4+a[k]][1];
    var pts=Math.round(sv*q[2]);
    deduct+=pts;
    if(sv>0)ri++;else si++;
    rows.push([q[1],pts,q[2],sv]);
  }
  if(deduct>100) deduct=100;
  var health=100-deduct;

  var ln,msg,lvColor,ringGrad;
  if(health<=40){
    ln="需尽快处理";lvColor="var(--terra)";ringGrad="gTerra";
    msg="您的风险已经不是“多交税”的问题，而是可能牵连到个人和家庭。这类情况我们见过很多，可以帮您梳理一下，您先知道到底有多大坑，再决定怎么填。";
  }else if(health<=65){
    ln="该重视了";lvColor="var(--amber)";ringGrad="gAmber";
    msg="几个问题一叠加，一旦被查或被举报，补税的钱可能会吃掉几年的辛苦利润。建议约一次私下聊聊，不给结论不推销，先帮您把真正的雷和擦边球分清楚。";
  }else if(health<=85){
    ln="有些隐患";lvColor="var(--gold-hi)";ringGrad="gGold";
    msg="多数老实做生意的餐饮人都在这个区间，日子能过，但经不起查。建议您先对照清单把自己过一遍，哪里卡住了，找个懂的人问一嘴就行。";
  }else{
    ln="底子不错";lvColor="var(--jade)";ringGrad="gJade";
    msg="恭喜您，您比90%的同行都清醒，接下来可以琢磨怎么在安全线内把多交的税“拿回来”。";
  }

  var dh="";
  for(var m=0;m<rows.length;m++){
    var r=rows[m];
    var cl=r[3]>=1?"bad":r[3]>0?"half":"ok";
    var bw=r[3]>0?Math.min(r[1]/12*100,100):0;
    var vt=r[3]>0?"-"+r[1]:"0";
    dh+='<div class="r-tr"><span class="r-tr-n">'+r[0]+'</span><div class="r-tr-b"><div class="r-tr-bi"><div class="r-tr-bf '+cl+'" style="width:0" data-w="'+bw+'"></div></div></div><span class="r-tr-v '+cl+'">'+vt+'</span></div>';
  }

  var R=104,CIRC=(2*Math.PI*R).toFixed(2);
  rC.innerHTML=
  '<div class="r-hero">'+
    '<div class="r-ey">ASSESSMENT REPORT</div>'+
    '<div class="r-brand">财税健康评估结果</div>'+
    '<div class="r-ring an">'+
      '<svg width="230" height="230" viewBox="0 0 230 230">'+
        '<defs>'+
          '<linearGradient id="gTerra" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#A85238"/><stop offset="100%" stop-color="#D98E6B"/></linearGradient>'+
          '<linearGradient id="gAmber" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#B07425"/><stop offset="100%" stop-color="#E8B05C"/></linearGradient>'+
          '<linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#C9A227"/><stop offset="100%" stop-color="#E8C95C"/></linearGradient>'+
          '<linearGradient id="gJade" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6E9A76"/><stop offset="100%" stop-color="#B8D4B0"/></linearGradient>'+
        '</defs>'+
        '<circle cx="115" cy="115" r="'+R+'" fill="none" stroke="rgba(240,235,221,.08)" stroke-width="9"/>'+
        '<circle id="rArc" cx="115" cy="115" r="'+R+'" fill="none" stroke="url(#'+ringGrad+')" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+CIRC+'" stroke-dashoffset="'+CIRC+'" style="transition:stroke-dashoffset 1.5s cubic-bezier(.4,0,.2,1);filter:drop-shadow(0 0 6px rgba(201,162,39,.35))"/>'+
      '</svg>'+
      '<div class="r-ring-in"><div class="r-sc-row"><span class="r-sc" id="rN">0</span><span class="r-sc-u">分</span></div><div class="r-ring-l">HEALTH SCORE / 100</div></div>'+
    '</div>'+
    '<div class="r-seal-w an d1"><span class="seal" style="color:'+lvColor+';border-color:'+lvColor+'">'+ln+'</span></div>'+
    '<div class="r-guide an d1">满分100 &middot; 分数越高越健康</div>'+
  '</div>'+
  '<div class="r-body">'+
    '<div class="panel r-kpis an d2">'+
      '<div class="r-kpi"><div class="r-kpi-l">健康得分</div><div class="r-kpi-v" id="rHp" style="color:'+lvColor+'">0</div><div class="r-kpi-s">满分 100</div></div>'+
      '<div class="r-kpi"><div class="r-kpi-l">风险扣分</div><div class="r-kpi-v" id="rDp" style="color:var(--terra)">0</div><div class="r-kpi-s">共扣 '+deduct+' 分</div></div>'+
      '<div class="r-kpi"><div class="r-kpi-l">安全项</div><div class="r-kpi-v" style="color:var(--jade)">'+si+'</div><div class="r-kpi-s">共 11 项</div></div>'+
    '</div>'+
    '<div class="panel r-spec an d3"><div class="r-spec-h">您的得分位置（越靠右越健康）</div><div class="r-bar-w"><div class="r-bar"></div><div class="r-pin" id="rPn" style="left:0"></div></div><div class="r-lbs"><span>高风险</span><span>健康</span></div></div>'+
    '<div class="panel goldline r-msg an d4">'+msg+'</div>'+
    '<div class="panel r-tbl an d5"><div class="r-tbl-h">逐项扣分明细（满分100，逐项扣减）</div>'+dh+'</div>'+
    '<button class="btn-redo an d5" id="btnR">重 新 测 试</button>'+
    '<div class="r-foot an d5">'+
      '<div class="r-foot-line"></div>'+
      '<div class="r-foot-b">函霖财税</div>'+
      '<div class="r-foot-en">HANLIN TAX ADVISORY</div>'+
      '<p class="r-fine">本测评仅供参考，不构成专业财税意见。关闭页面即消失。</p>'+
    '</div>'+
  '</div>';

  v1.classList.remove("on");v2.classList.add("on");
  window.scrollTo(0,0);
  document.getElementById("btnR").addEventListener("click",function(){for(var n=0;n<a.length;n++)a[n]=-1;c=0;v2.classList.remove("on");v0.classList.add("on");window.scrollTo(0,0);});
  setTimeout(function(){
    document.getElementById("rArc").style.strokeDashoffset=(CIRC*(1-health/100)).toFixed(2);
    document.getElementById("rPn").style.left=health+"%";
    countTo(document.getElementById("rN"),0,health,1500);
    countTo(document.getElementById("rHp"),0,health,1500);
    countTo(document.getElementById("rDp"),0,deduct,1500);
    var bs=document.querySelectorAll(".r-tr-bf");
    for(var b=0;b<bs.length;b++) bs[b].style.width=bs[b].getAttribute("data-w")+"%";
  },250);
}

function countTo(el,from,to,dur){
  var t0=performance.now();
  function tick(now){var t=Math.max(0,Math.min((now-t0)/dur,1)),e=1-Math.pow(1-t,3);el.textContent=Math.round(from+(to-from)*e);if(t<1)requestAnimationFrame(tick);}
  requestAnimationFrame(tick);
}
})();
</script>
</body>
</html>
