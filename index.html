<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>餐饮企业财税健康自测</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--c1:#1c595a;--c2:#458d8c;--c3:#85a6a1;--c4:#877384;--c5:#d7d8ae;--bg:#f0ede5;--border:#d8d4c8;--txt:#2a3836;--txt2:#6b7b78;--danger:#9e3b2f;--warn:#a07030;--safe:#3a7a5c}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.page{max-width:500px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.V{display:none;flex-direction:column;flex:1}.V.on{display:flex}
.v0{background:radial-gradient(ellipse at 20% 80%,rgba(133,166,161,.12),transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(215,216,174,.1),transparent 50%),linear-gradient(175deg,#1c595a,#24625f 25%,#2d6e68 50%,#3a7b72 75%,#2d6e68);padding:0 28px;justify-content:center;position:relative;overflow:hidden}
.s-deco{position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--c5),var(--c3),var(--c5));opacity:.3}
.s-ey{font-size:11px;letter-spacing:.15em;color:var(--c5);font-weight:500;opacity:.5;margin-bottom:24px}
.s-title{font-family:Georgia,"Songti SC","SimSun",serif;font-size:38px;font-weight:700;line-height:1.3;color:#fff;margin-bottom:16px}
.s-sub{font-size:15px;line-height:1.8;color:rgba(255,255,255,.5);margin-bottom:48px}
.s-sub em{font-style:normal;color:var(--c5);font-weight:600}
.s-row{display:flex;border:1px solid rgba(133,166,161,.25);border-radius:14px;overflow:hidden;margin-bottom:36px;background:rgba(133,166,161,.08)}
.s-cell{flex:1;padding:20px 10px;text-align:center;border-right:1px solid rgba(133,166,161,.15)}.s-cell:last-child{border-right:none}
.s-cell-v{font-size:26px;font-weight:800;color:#fff;line-height:1;margin-bottom:5px}.s-cell-v span{font-size:12px;font-weight:400;opacity:.5}
.s-cell-l{font-size:11px;color:rgba(255,255,255,.35);font-weight:500}
.btn-go{display:block;width:100%;padding:18px;background:var(--c5);color:var(--c1);border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;transition:transform .15s;box-shadow:0 4px 24px rgba(0,0,0,.12)}.btn-go:active{transform:scale(.98)}
.s-note{margin-top:18px;text-align:center;font-size:11px;color:rgba(255,255,255,.18);line-height:1.7}
.v1{background:radial-gradient(ellipse at 30% 0%,rgba(133,166,161,.06),transparent 50%),radial-gradient(ellipse at 70% 100%,rgba(215,216,174,.08),transparent 50%),linear-gradient(180deg,#edeae2,#f0ede5 40%,#f2efe7);padding:24px 20px}
.q-top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.q-num{font-family:Georgia,"Songti SC",serif;font-size:34px;font-weight:700;color:var(--c1);line-height:1}
.q-of{font-size:13px;color:var(--c3);font-weight:500}
.q-pbar{height:3px;background:rgba(133,166,161,.2);border-radius:3px;overflow:hidden;margin-bottom:28px}
.q-pfill{height:100%;background:linear-gradient(90deg,var(--c3),var(--c2));border-radius:3px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.q-card{background:#fff;border-radius:18px;flex:1;display:flex;flex-direction:column;overflow-y:auto;box-shadow:0 2px 20px rgba(28,89,90,.05);border:1px solid var(--border)}
.q-hd{padding:24px 24px 0}
.q-tag{display:inline-block;font-size:11px;font-weight:700;padding:5px 12px;border-radius:4px;margin-bottom:16px}
.q-tag-h{background:#f8efee;color:var(--danger);border-left:3px solid var(--danger)}
.q-tag-m{background:#f5f0e8;color:var(--warn);border-left:3px solid var(--warn)}
.q-tag-l{background:#eef3f0;color:var(--safe);border-left:3px solid var(--safe)}
.q-text{font-size:16px;line-height:1.85;color:#444;padding:0 24px;margin-bottom:24px}
.q-opts{border-top:1px solid var(--border)}
.q-opt{display:flex;align-items:flex-start;gap:14px;padding:16px 24px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .2s;-webkit-tap-highlight-color:transparent}
.q-opt:last-child{border-bottom:none;border-radius:0 0 18px 18px}
.q-opt:active{background:#f5f3ee}.q-opt.on{background:rgba(69,141,140,.06)}
.q-dot{width:18px;height:18px;border:2px solid #c5c0b5;border-radius:50%;flex-shrink:0;margin-top:3px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.q-opt.on .q-dot{border-color:var(--c2);background:var(--c2)}.q-opt.on .q-dot::after{content:"";width:6px;height:6px;background:#fff;border-radius:50%}
.q-opt-t{font-size:15px;line-height:1.6;color:var(--txt2);transition:color .2s}.q-opt.on .q-opt-t{color:var(--txt);font-weight:500}
.q-nav{display:flex;gap:10px;margin-top:20px}
.btn-q{flex:1;padding:16px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;border:none;transition:transform .15s}.btn-q:active{transform:scale(.98)}
.btn-bk{background:rgba(133,166,161,.12);color:var(--c3)}
.btn-fw{background:var(--c1);color:#fff;box-shadow:0 4px 16px rgba(28,89,90,.15)}
.btn-fw:disabled{background:#c5c0b5;color:#a8a49a;cursor:not-allowed;box-shadow:none}.btn-fw:disabled:active{transform:none}
.v2{background:radial-gradient(ellipse at 30% 0%,rgba(133,166,161,.06),transparent 50%),radial-gradient(ellipse at 70% 100%,rgba(215,216,174,.08),transparent 50%),linear-gradient(180deg,#edeae2,#f0ede5 40%,#f2efe7);padding:0 0 32px}
.r-hero{padding:44px 28px 36px;position:relative;overflow:hidden;color:#fff}.r-hero::before{content:"";position:absolute;inset:0;pointer-events:none}
.r-h4{background:linear-gradient(160deg,#4a2020,#6b3030 40%,#7d3838)}.r-h4::before{background:radial-gradient(ellipse at 80% 30%,rgba(180,100,100,.08),transparent 60%)}
.r-h3{background:linear-gradient(160deg,#3b3020,#6b5530 40%,#7d6838)}.r-h3::before{background:radial-gradient(ellipse at 30% 60%,rgba(180,160,80,.06),transparent 60%)}
.r-h2{background:linear-gradient(160deg,#2a3b30,#3d5a48 50%,#4a6b55)}.r-h2::before{background:radial-gradient(ellipse at 50% 30%,rgba(133,166,161,.08),transparent 60%)}
.r-h1{background:radial-gradient(ellipse at 20% 80%,rgba(133,166,161,.1),transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(215,216,174,.08),transparent 50%),linear-gradient(160deg,#1c595a,#24625f 40%,#2d6e68)}
.r-deco{height:3px;background:linear-gradient(90deg,rgba(215,216,174,.3),rgba(133,166,161,.3),rgba(215,216,174,.3));border:none;margin-bottom:20px}
.r-ey{font-size:11px;letter-spacing:.1em;color:rgba(255,255,255,.35);font-weight:500;margin-bottom:16px}
.r-sc-row{display:flex;align-items:baseline;gap:6px;margin-bottom:8px}
.r-sc{font-family:Georgia,"Songti SC",serif;font-size:84px;font-weight:700;line-height:1;letter-spacing:-.04em}
.r-sc-u{font-size:18px;font-weight:500;opacity:.3}
.r-lv{font-size:20px;font-weight:700;color:var(--c5);letter-spacing:.06em;margin-bottom:4px}
.r-guide{margin-top:10px;font-size:11px;color:rgba(255,255,255,.35)}
.r-body{padding:20px 20px 0}
.r-kpis{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--border);border-radius:14px;overflow:hidden;background:#fff;margin-bottom:14px;box-shadow:0 2px 12px rgba(28,89,90,.04)}
.r-kpi{padding:18px 10px;text-align:center;border-right:1px solid var(--border)}.r-kpi:last-child{border-right:none}
.r-kpi-l{font-size:11px;color:var(--c3);font-weight:600;margin-bottom:8px}
.r-kpi-v{font-size:24px;font-weight:800;line-height:1;margin-bottom:4px}
.r-kpi-s{font-size:11px;color:#bbb}
.r-spec{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px 16px;margin-bottom:14px;box-shadow:0 2px 12px rgba(28,89,90,.04)}
.r-spec-h{font-size:12px;font-weight:600;color:var(--c3);margin-bottom:12px}
.r-bar-w{position:relative;margin-bottom:8px}
.r-bar{height:10px;border-radius:10px;overflow:hidden;background:linear-gradient(90deg,#a87070 0%,#c4a882 40%,#d7d8ae 60%,#85a6a1 80%,#6b9b90 100%)}
.r-pin{position:absolute;top:-3px;width:16px;height:16px;border-radius:50%;background:var(--c1);border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.2);transform:translateX(-50%);transition:left 1.4s cubic-bezier(.34,1.56,.64,1)}
.r-lbs{display:flex;justify-content:space-between;font-size:10px;color:#bbb}
.r-msg{background:#fff;border:1px solid var(--border);border-radius:14px;padding:22px 20px;margin-bottom:14px;box-shadow:0 2px 12px rgba(28,89,90,.04);font-size:15px;line-height:1.85;color:#555;border-left:3px solid var(--c2)}
.r-tbl{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:20px;box-shadow:0 2px 12px rgba(28,89,90,.04)}
.r-tbl-h{font-size:12px;font-weight:600;color:var(--c3);padding:14px 20px 12px;border-bottom:2px solid var(--c1)}
.r-tr{display:flex;align-items:center;padding:0 20px;border-bottom:1px solid #ece8df;min-height:48px}.r-tr:last-child{border-bottom:none}.r-tr:nth-child(even){background:#fafaf7}
.r-tr-n{flex:1;font-size:13px;color:var(--txt2);padding:10px 0}
.r-tr-b{width:68px;margin-right:10px}.r-tr-bi{height:4px;border-radius:4px;background:rgba(133,166,161,.15);overflow:hidden}
.r-tr-bf{height:100%;border-radius:4px;transition:width 1s cubic-bezier(.4,0,.2,1)}.r-tr-bf.bad{background:linear-gradient(90deg,#c09090,var(--danger))}.r-tr-bf.half{background:linear-gradient(90deg,#c4a882,var(--warn))}.r-tr-bf.ok{background:var(--c3)}
.r-tr-v{min-width:44px;text-align:right;font-size:13px;font-weight:700}.r-tr-v.bad{color:var(--danger)}.r-tr-v.half{color:var(--warn)}.r-tr-v.ok{color:var(--safe)}
.btn-redo{display:block;width:calc(100% - 40px);margin:0 20px;padding:15px;background:#fff;border:1px solid var(--border);border-radius:14px;font-size:15px;font-weight:600;color:var(--c3);cursor:pointer;transition:transform .15s}.btn-redo:active{transform:scale(.98)}
.r-fine{margin-top:16px;text-align:center;font-size:11px;color:#c5c0b5;line-height:1.7;padding:0 20px}
.an{animation:su .4s cubic-bezier(.4,0,.2,1) both}.d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.16s}.d4{animation-delay:.22s}.d5{animation-delay:.28s}
@keyframes su{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:400px){.s-title{font-size:32px}.r-sc{font-size:68px}.r-hero{padding:36px 22px 28px}.r-tr-b{width:52px}}
</style>
</head>
<body>
<div class="page">
  <div class="V v0 on" id="v0"><div class="s-deco"></div>
    <div class="s-ey">财税风险自测</div>
    <h1 class="s-title">餐饮企业<br>财税健康自测</h1>
    <p class="s-sub">10 分钟自查，看看您的利润<br>有多少在<em>&ldquo;裸奔&rdquo;</em></p>
    <div class="s-row"><div class="s-cell"><div class="s-cell-v">11</div><div class="s-cell-l">道风险题</div></div><div class="s-cell"><div class="s-cell-v">5<span>分钟</span></div><div class="s-cell-l">完成时间</div></div><div class="s-cell"><div class="s-cell-v">0</div><div class="s-cell-l">信息收集</div></div></div>
    <button class="btn-go" id="btnGo">开始自测</button>
    <p class="s-note">完全匿名 &middot; 数据仅在您的设备上运行</p>
  </div>
  <div class="V v1" id="v1">
    <div class="q-top"><span class="q-num" id="qN"></span><span class="q-of" id="qO"></span></div>
    <div class="q-pbar"><div class="q-pfill" id="qP"></div></div>
    <div class="q-card" id="qC"></div>
    <div class="q-nav"><button class="btn-q btn-bk" id="bB">上一题</button><button class="btn-q btn-fw" id="bF">下一题</button></div>
  </div>
  <div class="V v2" id="v2"><div id="rC"></div></div>
</div>
<script>
(function(){
var W=[12,12,12,12,12,7,7,7,7,5,5];
var Q=[];
Q.push([1,"多执照/多门店混同穿透",W[0],
"名下有好几个个体户或公司，收入、采购、员工工资全搅在一起，这家收的钱拿去补那家的亏，会计随便分着报。自己觉得反正都是“自己的生意”——可一旦哪家被查，所有关联主体的账都会被打通看，一家出事全部牵连。这个穿透风险，您清楚吗？",
["不清楚，我的几家店确实都混着管",1],["大概知道不对，但没办法分开",0.5],["每家都独立核算，互不穿帮 / 只有单店",0]]);
Q.push([2,"拆分收入套用小规模额度",W[1],
"为了省税，开好几个执照，每个季度开票都卡在30万以内，或者月度10万以内，维持小规模纳税人。税务局现在是按实际控制人合并计算的，穿透后超过了照样补税——这个判定方式，您了解过吗？",
["没了解，觉得一直这样没事",1],["知道有规定，但还在这么做",0.5],["没有拆分，就一个执照合规纳税",0]]);
Q.push([3,"私卡收款",W[2],
"生意忙，用个人微信、支付宝或家人的卡收营业款，确实方便。但现在银行会把大额私卡流水直接推给税务局——这个新规矩，您有没有留意过？",
["知道，但还这么做",1],["没想过，一直这么做",0.5],["已经全部走对公账户了",0]]);
Q.push([4,"加盟费私收",W[3],
"加盟商的钱不走对公账、不开发票，直接打到个人卡上。对方跟您好的时候没事，一旦闹翻去举报，您前几年的私账都会被翻出来查个遍——这个雷握在别人手里，您担心过吗？",
["担心，但一直都是这么收的",1],["没想过加盟商还会举报",0.5],["全部走公账规范开票 / 无加盟业务",0]]);
Q.push([5,"未开票收入隐匿",W[4],
"除了平台上必须开票的部分，剩下的散客、团餐款、宴席定金，不开票也不申报。税务局会拿您周围同行的平均数据和您比，长期偏低系统会自动报警——这个比对机制，您听说过吗？",
["没听说，未开票的部分我确实没报",1],["听说过，但还是没报",0.5],["没报的也正常申报了",0]]);
Q.push([6,"采购无票",W[5],
"图便宜采购食材不要票，大家都懂。可成本票缺口一大，要么硬抗多交税，要么用别的发票往里“凑”，或者虚列一部分。您现在是哪种情况？",
["缺口大，多交税又不甘心",1],["在用其他发票冲抵或虚列，先混过去",0.5],["基本都要票，缺口很小",0]]);
Q.push([7,"大额装修无票",W[6],
"几十万甚至上百万的装修，包工头开不了票，您就用一纸协议或白条入账，慢慢摊销。一旦查账，没票的成本全部被扒掉，让您补一大笔企业所得税——这个金额您大概算过会是多少吗？",
["没算过，不知道会补多少",1],["知道风险大，但没办法解决",0.5],["大额支出都要到了合规发票 / 无此类支出",0]]);
Q.push([8,"公私不分：报销和借款",W[7],
"自己的车、孩子的兴趣班、家里的开销往公司账上报，或者从公司账户直接打钱给个人用，账上长期挂着“老板借款”几十万上百万。会计上这叫股东消费或占款，被查到不仅要补企业所得税，还要追缴20%的分红个税——这个账，以前有人帮您算过吗？",
["没算过，一直这么操作",1],["知道有点问题，但拖着没处理",0.5],["个人和公司账目分得很清，没有大额挂账",0]]);
Q.push([9,"工资分拆",W[8],
"工资分两批发，公账发基本工资保个税最低档，剩下的用私卡或现金补。办法不新鲜，可一旦有员工闹翻了去举报，所有人的账都会翻一遍——这事您琢磨过吗？",
["知道有隐患，但没找到好办法",1],["没想过，觉得内部人不会捅",0.5],["工资全额走公账并报税",0]]);
Q.push([10,"社保缴纳不合规",W[9],
"员工社保这块，是不是有不少人没交、少交，或者不管工资多少统统按最低基数交？试用期不交更常见。社保现在归税务管，数据一比对就穿帮，一旦被查，要补缴从入职起所有年份的社保，外加滞纳金——您店里现在这个情况存在吗？",
["挺普遍的，不少人都没交或按最低交",1],["只有少数几个人没交或没交全",0.5],["全体员工都足额缴纳",0]]);
Q.push([11,"僵尸店不注销",W[10],
"干不下去的门店关了就不管了，营业执照不注销、税务不申报，以为没经营就是零。结果法人会被列入黑名单，连累您还在正常经营的其他店，甚至影响个人贷款、出行、孩子上学——您有没有这样的“僵尸店”一直搁着？",
["有，关了就没管过",1],["不确定现在状态算不算异常",0.5],["关一家清一家，都注销干净了",0]]);

var MAXD=96;
var c=0,a=[];
for(var i=0;i<Q.length;i++) a.push(-1);
var v0=document.getElementById("v0"),v1=document.getElementById("v1"),v2=document.getElementById("v2");
var qN=document.getElementById("qN"),qO=document.getElementById("qO"),qP=document.getElementById("qP");
var qC=document.getElementById("qC"),bB=document.getElementById("bB"),bF=document.getElementById("bF");
var rC=document.getElementById("rC");

document.getElementById("btnGo").addEventListener("click",function(){v0.classList.remove("on");v1.classList.add("on");draw();});
bB.addEventListener("click",function(){if(c>0){c--;draw();}});
bF.addEventListener("click",function(){if(a[c]<0)return;if(c<Q.length-1){c++;draw();}else showResult();});
qC.addEventListener("click",function(e){var el=e.target;while(el&&el!==qC){if(el.getAttribute&&el.getAttribute("data-i")!==null){a[c]=parseInt(el.getAttribute("data-i"),10);draw();return;}el=el.parentElement;}});

function draw(){
  var q=Q[c],n=Q.length;
  qN.textContent=String(q[0]).padStart(2,"0");
  qO.textContent=" / "+n;
  qP.style.width=((c+1)/n*100)+"%";
  var tc=q[2]>=10?"q-tag-h":q[2]>=6?"q-tag-m":"q-tag-l";
  var tl=q[2]>=10?"高风险项":q[2]>=6?"中风险项":"一般项";
  var h='<div class="q-hd"><div class="q-tag '+tc+'">'+tl+'</div></div>';
  h+='<div class="q-text">'+q[3]+'</div><div class="q-opts">';
  for(var j=0;j<3;j++){
    var s=a[c]===j?" on":"";
    h+='<div class="q-opt'+s+'" data-i="'+j+'"><div class="q-dot"></div><div class="q-opt-t">'+q[4+j][0]+'</div></div>';
  }
  h+="</div>";
  qC.innerHTML=h;
  bB.style.visibility=c===0?"hidden":"visible";
  bF.textContent=c===n-1?"查看结果":"下一题";
  bF.disabled=a[c]<0;
}

function showResult(){
  var deduct=0,ri=0,si=0,rows=[];
  for(var k=0;k<Q.length;k++){
    var q=Q[k];
    var sv=q[4+a[k]][1];
    var pts=Math.round(sv*q[2]);
    deduct+=pts;
    if(sv>0)ri++;else si++;
    rows.push([q[1],pts,q[2],sv]);
  }
  if(deduct>100) deduct=100;
  var health=100-deduct;

  var lv,ln,hcls,msg,hColor;
  if(health<=40){
    lv=4;ln="需尽快处理";hcls="r-h4";hColor="var(--danger)";
    msg="您的风险已经不是“多交税”的问题，而是可能牵连到个人和家庭。这类情况我们见过很多，可以帮您梳理一下，您先知道到底有多大坑，再决定怎么填。";
  }else if(health<=65){
    lv=3;ln="该重视了";hcls="r-h3";hColor="var(--warn)";
    msg="几个问题一叠加，一旦被查或被举报，补税的钱可能会吃掉几年的辛苦利润。建议约一次私下聊聊，不给结论不推销，先帮您把真正的雷和擦边球分清楚。";
  }else if(health<=85){
    lv=2;ln="有些隐患";hcls="r-h2";hColor="var(--c2)";
    msg="多数老实做生意的餐饮人都在这个区间，日子能过，但经不起查。建议您先对照清单把自己过一遍，哪里卡住了，找个懂的人问一嘴就行。";
  }else{
    lv=1;ln="底子不错";hcls="r-h1";hColor="var(--safe)";
    msg="恭喜您，您比90%的同行都清醒，接下来可以琢磨怎么在安全线内把多交的税“拿回来”。";
  }

  var dh="";
  for(var m=0;m<rows.length;m++){
    var r=rows[m];
    var cl=r[3]>=1?"bad":r[3]>0?"half":"ok";
    var bw=r[3]>0?Math.min(r[1]/12*100,100):0;
    var vt=r[3]>0?"-"+r[1]:"0";
    dh+='<div class="r-tr"><span class="r-tr-n">'+r[0]+'</span><div class="r-tr-b"><div class="r-tr-bi"><div class="r-tr-bf '+cl+'" style="width:0" data-w="'+bw+'"></div></div></div><span class="r-tr-v '+cl+'">'+vt+'</span></div>';
  }

  rC.innerHTML='<div class="r-hero '+hcls+'"><div class="r-inner"><hr class="r-deco"><div class="r-ey">财税健康评估结果</div><div class="r-sc-row"><span class="r-sc" id="rN">100</span><span class="r-sc-u">分</span></div><div class="r-lv">'+ln+'</div><div class="r-guide">满分100 \xb7 分数越高越健康</div></div></div><div class="r-body"><div class="r-kpis an d1"><div class="r-kpi"><div class="r-kpi-l">健康得分</div><div class="r-kpi-v" id="rHp" style="color:'+hColor+'">100</div><div class="r-kpi-s">满分 100</div></div><div class="r-kpi"><div class="r-kpi-l">风险扣分</div><div class="r-kpi-v" id="rDp" style="color:var(--danger)">0</div><div class="r-kpi-s">共扣 '+deduct+' 分</div></div><div class="r-kpi"><div class="r-kpi-l">安全项</div><div class="r-kpi-v" style="color:var(--safe)">'+si+'</div><div class="r-kpi-s">共 11 项</div></div></div><div class="r-spec an d2"><div class="r-spec-h">您的得分位置（越靠右越健康）</div><div class="r-bar-w"><div class="r-bar"></div><div class="r-pin" id="rPn" style="left:0"></div></div><div class="r-lbs"><span>高风险</span><span>健康</span></div></div><div class="r-msg an d3">'+msg+'</div><div class="r-tbl an d4"><div class="r-tbl-h">逐项扣分明细（满分100，逐项扣减）</div>'+dh+'</div><button class="btn-redo an d5" id="btnR">重新测试</button><p class="r-fine">本测评仅供参考，不构成专业财税意见。关闭页面即消失。</p></div>';

  v1.classList.remove("on");v2.classList.add("on");
  document.getElementById("btnR").addEventListener("click",function(){for(var n=0;n<a.length;n++)a[n]=-1;c=0;v2.classList.remove("on");v0.classList.add("on");});
  setTimeout(function(){
    document.getElementById("rPn").style.left=health+"%";
    countTo(document.getElementById("rN"),100,health,1400);
    countTo(document.getElementById("rHp"),100,health,1400);
    countTo(document.getElementById("rDp"),0,deduct,1400);
    var bs=document.querySelectorAll(".r-tr-bf");
    for(var b=0;b<bs.length;b++) bs[b].style.width=bs[b].getAttribute("data-w")+"%";
  },200);
}

function countTo(el,from,to,dur){
  var t0=performance.now();
  function tick(now){var t=Math.min((now-t0)/dur,1),e=1-Math.pow(1-t,3);el.textContent=Math.round(from+(to-from)*e);if(t<1)requestAnimationFrame(tick);}
  requestAnimationFrame(tick);
}
})();
</script>
</body>
</html>
